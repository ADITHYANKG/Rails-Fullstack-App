version: "3.8"
services:
  db:
    image: postgres:15
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: myapp_production

  web:
    build: .
    ports:
         - "0.0.0.0:3000:3000"
    depends_on:
      - db
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://postgres:password@db/myapp_production
      # Never write the key here. Set it in your shell before `docker compose up`:
      #   PowerShell:  $env:RAILS_MASTER_KEY = Get-Content config/master.key
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?Set RAILS_MASTER_KEY from config/master.key}

volumes:
  postgres_data:
